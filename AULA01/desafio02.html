<body>
    <h1><mark>DESAFIO</mark></h1>
    <hr>
    <script>
        window.alert("REALIZANDO CONTAS");
        let num1 = parseInt(window.prompt("ESCOLHA O 1° NÚMERO"));
    
        let num2 = parseInt(window.prompt("ESCOLHA O 2° NÚMERO"));
        
        let resul = 0

        let oprd = window.prompt("ESCOLHA O OPERADOR (+) OU (-)");
        if (oprd == "+"){
            resul = num1 + num2
        }else{
            resul = num1 - num2
        }
        document.getElementsByTagName(<h2>("O resultado da sua conta é: "+resul)</h2>);
    </script>
</body>
